<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F8F1F2">
<meta name="color-scheme" content="light">
<title>HappyGift</title>
<!-- ================= НАСТРОЙКИ: менять можно только эти четыре строки ================= -->
<!-- Ссылка на мини-приложение из BotFather, вида https://t.me/ИмяБота/ИмяПриложения -->
<meta name="happygift:bot" content="https://t.me/happygift_app_bot/app">
<!-- Ссылка на страницу для донатов (обязательно начинается с https://) -->
<meta name="happygift:donate" content="https://boosty.to/neurovibe/donate">
<!-- Адрес сервера из Yandex Cloud, вида https://functions.yandexcloud.net/... Пока пусто, всё хранится только на одном телефоне -->
<meta name="happygift:server" content="https://functions.yandexcloud.net/d4eevubjhr1irc5fmhbo">
<!-- Режим проверки с тестовыми участниками: on или off. Когда вписан адрес сервера, он выключается сам -->
<meta name="happygift:test" content="off">
<!-- ================= Ниже ничего не менять: приложение защищено от изменений и перестанет запускаться ================= -->
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-5peEq7NUwJm9zoB/VNlqzVJGqdr+sJp/Z/z2J6Ncyuk=' https://telegram.org; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src https://functions.yandexcloud.net; base-uri 'none'; form-action 'none'; object-src 'none'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@700&display=swap&subset=cyrillic" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#F8F1F2; --card:#FFFFFF; --blush:#FCEBEE; --blush-2:#F4D3D9; --line:#EBD9DD;
  --ink:#3A0A14; --mute:#7F5F67; --faint:#B39AA1;
  --red:#C8102E; --red-2:#DC1F3E; --red-d:#9E0B24; --burg:#5A0818; --gold:#E9C46A;
  --r-s:10px; --r-m:14px; --r-l:18px; --r-xl:20px;
  --sh-1:0 1px 2px rgba(90,8,24,.05),0 10px 26px -14px rgba(90,8,24,.22);
  --ease:cubic-bezier(.22,.8,.3,1);
  --display:'Unbounded','Manrope',system-ui,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;font-weight:500;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{min-height:100dvh;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 20px calc(env(safe-area-inset-bottom) + 32px)}
#app.enter{animation:enter .3s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--body);font-weight:800;margin:0;line-height:1.18;letter-spacing:-.02em;color:var(--ink)}
h1{font-size:28px}
h2{font-size:20px}
h3{font-size:17px;font-weight:800;letter-spacing:-.01em}
p{margin:0}
b{font-weight:700}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px;border-radius:var(--r-m)}
.ic{flex:none;display:block}

.muted{color:var(--mute)}
.small{font-size:14px}
.center{text-align:center}
.stack>*+*{margin-top:var(--gap,16px)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.tnote{color:var(--mute)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;margin-bottom:24px}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em;color:var(--ink)}
.brand .mk{width:34px;height:34px;border-radius:var(--r-s);background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 8px 16px -8px rgba(200,16,46,.7)}
.iconbtn{width:44px;height:44px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:background-color .18s var(--ease),transform .18s var(--ease)}
.iconbtn:active{background:var(--blush);transform:scale(.95)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:0 24px;border-radius:var(--r-m);border:0;background:linear-gradient(180deg,var(--red-2),var(--red));color:#fff;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 12px 24px -12px rgba(200,16,46,.75),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .18s var(--ease),filter .18s var(--ease),background-color .18s var(--ease)}
.btn:active{transform:scale(.985);filter:brightness(.93)}
.btn[disabled]{background:#EBDDE0;color:#A58A91;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--red-d);box-shadow:inset 0 0 0 1.5px var(--red)}
.btn.ghost:active{background:var(--blush)}
.btn.small{min-height:46px;font-size:14px;padding:0 20px;width:auto}
.link{background:none;border:0;padding:10px 0;color:var(--red-d);font-weight:700;cursor:pointer;font-size:15px}
.link.danger{color:var(--red)}
.bar{position:sticky;bottom:0;z-index:4;margin:8px -20px -32px;padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);background:linear-gradient(to top,var(--bg) 64%,rgba(248,241,242,0))}

/* fields */
label.f{display:block;font-weight:700;font-size:14px;margin-bottom:8px;color:var(--ink)}
.in{width:100%;min-height:52px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;outline:none;color:var(--ink);transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
.in::placeholder{color:var(--faint)}
.in:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(200,16,46,.12)}
textarea.in{min-height:124px;resize:vertical;line-height:1.5}
.inw{position:relative}
.inw .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.inw .in{padding-left:46px}
.hint{font-size:13px;color:var(--mute);margin-top:8px}
.err{color:var(--red);font-size:14px;font-weight:700;margin-top:10px}

/* avatars */
.av{--s:48px;display:inline-grid;place-items:center;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;flex:none}
.av svg{width:100%;height:100%;display:block}
.bigav{display:block;width:112px;height:112px;margin:0 0 20px;border-radius:50%;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--red),0 18px 34px -14px rgba(200,16,46,.55)}
.bigav .av{display:block}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avbtn{background:none;border:0;padding:5px;border-radius:50%;cursor:pointer;display:grid;place-items:center;aspect-ratio:1;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .18s var(--ease),transform .18s var(--ease)}
.avbtn:active{transform:scale(.94)}
.avbtn[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--red)}
.avbtn .av{width:100%;height:auto;aspect-ratio:1}
.avs{display:inline-flex;align-items:center}
.avs .av{box-shadow:0 0 0 2.5px var(--card)}
.avs .av+.av,.avs .av+.avmore{margin-left:-9px}
.avmore{margin-left:-9px;width:30px;height:30px;border-radius:50%;background:var(--blush-2);color:var(--red-d);font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2.5px var(--card)}

/* method tiles + chips */
.mtiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mtile{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-l);padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:border-color .18s var(--ease),background-color .18s var(--ease)}
.mtile .ico{width:42px;height:42px;border-radius:var(--r-m);background:var(--blush);display:grid;place-items:center;color:var(--red);transition:background-color .18s var(--ease),color .18s var(--ease)}
.mtile b{display:block;font-weight:800;font-size:16px}
.mtile span.sub{font-size:13px;color:var(--mute);line-height:1.4}
.mtile[aria-pressed="true"]{border-color:var(--red);background:var(--blush)}
.mtile[aria-pressed="true"] .ico{background:var(--red);color:#fff}
.pvz{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:18px;margin-top:12px}
.pvz .in{background:#FBF6F7}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:var(--blush);border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;color:var(--ink);transition:background-color .18s var(--ease),color .18s var(--ease)}
.chips button[aria-pressed="true"]{background:var(--red);color:#fff}

/* home */
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:1fr 104px;gap:8px;align-items:center;margin-bottom:28px;padding:24px 20px 24px 22px;border-radius:var(--r-xl);color:#fff;background:radial-gradient(120% 100% at 100% 0%,rgba(255,255,255,.16),transparent 55%),linear-gradient(155deg,#D4122F,#9E0B24);box-shadow:0 26px 40px -26px rgba(158,11,36,.75)}
.hero::before{content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.7) 1.4px,transparent 2px),radial-gradient(circle,rgba(255,255,255,.45) 1px,transparent 1.6px);background-size:61px 53px,37px 41px;background-position:12px 9px,5px 21px;-webkit-mask-image:linear-gradient(120deg,transparent 30%,#000);mask-image:linear-gradient(120deg,transparent 30%,#000)}
.hero>*{position:relative}
.hero h1{color:#fff;font-size:28px;overflow-wrap:anywhere}
.hero p{margin-top:10px;color:rgba(255,255,255,.86);font-size:14.5px;line-height:1.45}
.hero svg{width:104px;height:104px;display:block}
.gtile{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:18px;cursor:pointer;box-shadow:var(--sh-1);transition:transform .18s var(--ease),background-color .18s var(--ease);color:inherit}
.gtile:active{transform:scale(.985);background:var(--blush)}
.gtile .gt-top{display:flex;align-items:flex-start;gap:12px}
.gtile .gt-top .ic{color:var(--red);margin-top:2px}
.gtile h3{font-size:18px;line-height:1.25}
.gtile .gt-bot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--mute)}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
.status.done{color:var(--red-d)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;background:var(--blush);color:var(--red-d);white-space:nowrap}
.chip.gold{background:var(--red);color:#fff}
.sect{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px}
.sect .muted{font-weight:700}

/* group */
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:7px 12px 7px 10px;font-size:13px;font-weight:700}
.pill .ic{color:var(--red)}
.ticket{position:relative;border-radius:var(--r-xl);color:#fff;background:radial-gradient(120% 100% at 100% 0%,rgba(255,255,255,.14),transparent 55%),linear-gradient(155deg,#D4122F,#9E0B24);box-shadow:0 26px 40px -26px rgba(158,11,36,.75)}
.tk-top{padding:22px 24px 20px}
.tk-top .small{color:rgba(255,255,255,.8);font-weight:600}
.tk-cut{position:relative;border-top:2px dashed rgba(255,255,255,.38);margin:0 22px}
.tk-cut::before,.tk-cut::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.tk-cut::before{left:-33px}
.tk-cut::after{right:-33px}
.tk-bot{padding:18px 22px 22px;display:flex;gap:10px}
.tk-bot .btn{flex:1 1 0;padding:0 12px;white-space:nowrap;background:#fff;color:var(--red-d);box-shadow:none}
.tk-bot .btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75)}
.tk-bot .btn:active{filter:none;background:var(--blush)}
.tk-bot .btn.ghost:active{background:rgba(255,255,255,.14)}
.code{font-family:var(--display);font-size:32px;letter-spacing:.14em;font-weight:700;margin-top:4px;color:#fff}
.plist{background:var(--card);border:1px solid var(--line);border-radius:var(--r-l);padding:0 16px;box-shadow:var(--sh-1)}
.item{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);width:100%}
.item:last-child{border-bottom:0}
.item .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .how{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute)}
.item .how .ic{color:var(--red)}
details.test{margin-top:8px;border-top:1px solid var(--line);padding-top:16px}
details.test summary{cursor:pointer;color:var(--mute);font-weight:700;font-size:14px}
.check{display:flex;gap:14px;align-items:flex-start;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px}
.check input{width:22px;height:22px;accent-color:var(--red);margin-top:2px;flex:none}

/* parcel notice */
.parcel{background:var(--card);border-radius:var(--r-l);padding:20px;margin-bottom:28px;box-shadow:inset 0 0 0 1.5px var(--red),var(--sh-1)}
.parcel .ph{display:flex;align-items:center;gap:12px}
.parcel .pico{width:42px;height:42px;border-radius:var(--r-m);background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.parcel .shot{max-height:340px;cursor:zoom-in}
.shot{display:block;width:100%;max-height:260px;object-fit:contain;background:#fff;border-radius:12px;border:1px solid var(--line)}
.shot.old{opacity:.35;cursor:default!important}
.filebtn{position:relative;cursor:pointer}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
.filebtn:focus-within{outline:2px solid var(--red);outline-offset:3px}

/* gift tag */
.tagwrap{display:flex;justify-content:center;margin:8px 0 32px;padding-top:34px;position:relative}
.tagwrap::before{content:"";position:absolute;left:50%;bottom:-4px;width:76%;height:26px;transform:translateX(-50%);background:rgba(90,8,24,.24);border-radius:50%;filter:blur(16px);pointer-events:none}
.string{position:absolute;top:0;left:50%;width:120px;height:70px;transform:translateX(-50%);pointer-events:none}
.tag{position:relative;width:100%;max-width:340px;background:var(--card);color:var(--ink);padding:60px 24px 28px;clip-path:polygon(22% 0,78% 0,100% 9%,100% 100%,0 100%,0 9%);transform-origin:50% 0;box-shadow:inset 0 8px 0 var(--red)}
.tag::before{content:"";position:absolute;top:18px;left:50%;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 4px var(--red)}
.tag.swing{animation:swing 1.3s cubic-bezier(.3,.7,.4,1) both}
@keyframes swing{0%{transform:rotate(-9deg)}22%{transform:rotate(6deg)}44%{transform:rotate(-3.5deg)}66%{transform:rotate(1.8deg)}100%{transform:rotate(0)}}
.tag .who{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.tag .meta{margin-top:18px;padding-top:16px;border-top:1.5px dashed var(--blush-2);font-size:15px}
.tag .meta .lab{font-weight:700;font-size:13px;color:var(--mute);margin-bottom:2px}
.tag .meta p+.lab{margin-top:14px}
.tag .wish{white-space:pre-wrap;word-break:break-word}
.tag .closed{text-align:center}
.tag .closed h2{margin-bottom:8px}
.tag .closed p{color:var(--mute);margin-bottom:20px}
.tag .btn[data-a=hide]{background:var(--burg);box-shadow:none}
.tag .qmark{font-family:var(--display);font-weight:700;font-size:64px;line-height:1;color:var(--red);margin-bottom:10px}
.tag .in{background:var(--bg);border-color:transparent}
.alert{background:var(--blush);color:var(--red-d);font-weight:700;border-radius:var(--r-m);padding:12px 14px;margin-bottom:12px;font-size:14px}

/* chat */
.chat{margin-bottom:32px}
.chat-h{display:flex;align-items:center;gap:10px}
.chat-h .ic{color:var(--red)}
.segtabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:4px;margin-top:14px}
.segtabs button{flex:1;min-width:0;background:none;border:0;border-radius:var(--r-s);padding:10px 8px;font-weight:700;font-size:14px;cursor:pointer;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background-color .18s var(--ease),color .18s var(--ease)}
.segtabs button[aria-pressed="true"]{background:var(--red);color:#fff}
.treestrip{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 24px;padding:12px 12px 12px 14px;border:0;border-radius:var(--r-m);cursor:pointer;color:#fff;font:inherit;text-align:left;background:linear-gradient(172deg,#7A0B22,#4C0716);box-shadow:0 14px 24px -18px rgba(74,6,22,.8);transition:transform .18s var(--ease)}
.treestrip:active{transform:scale(.985)}
.treestrip .ts-t{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.treestrip .ts-n{font-size:13px;color:rgba(255,255,255,.82);white-space:nowrap}
.treestrip .ts-n b{font-size:15px;color:#fff}
.treestrip.full .ts-n b{color:#F7D58A}
.treestrip>.ic{opacity:.7;flex:none}
@media (max-width:379px){.segtabs.main button .ic{display:none}.segtabs.main button{font-size:13px}}
.segtabs.main{margin:0 0 16px;position:sticky;top:8px;z-index:20;box-shadow:0 10px 24px -16px rgba(58,10,20,.45)}
.segtabs.main button{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 4px;overflow:visible}
.segtabs.main button .ic{flex:none}
.segtabs button[aria-pressed="true"] .badge{background:#fff;color:var(--red)}
.seglead{font-size:14px;line-height:1.5;color:var(--mute);margin:0 0 16px}
.pill.soon{background:var(--blush);border-color:var(--blush-2);color:var(--red-d)}
.soonline{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--red-d);font-weight:700}
.badge{background:var(--red);color:#fff;border-radius:8px;font-size:12px;padding:1px 7px;margin-left:6px}
.chatlog{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding:4px 2px;margin:16px 0;overscroll-behavior:contain}
.msg{max-width:82%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-break:break-word}
.msg.me{align-self:flex-end;background:linear-gradient(180deg,var(--red-2),var(--red));color:#fff;border-bottom-right-radius:5px}
.msg.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg time{display:block;font-size:11px;opacity:.7;margin-top:2px}
.chatform{display:flex;gap:8px;align-items:center}
.chatform .in{flex:1;min-width:0}
.sendbtn{width:52px;height:52px;border-radius:var(--r-m);border:0;background:linear-gradient(180deg,var(--red-2),var(--red));color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 10px 20px -10px rgba(200,16,46,.75);transition:transform .18s var(--ease)}
.sendbtn:active{transform:scale(.94)}

/* splash */
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(130% 70% at 50% 0%,#6E0B20 0%,#4A0614 75%);overflow:hidden;transition:opacity .45s}
#splash:empty{display:none}
#splash.out{opacity:0;pointer-events:none}
.sp-tools{position:absolute;z-index:3;top:calc(env(safe-area-inset-top) + 14px);left:16px;right:16px;display:flex;align-items:center;justify-content:space-between}
.sp-skip{background:none;border:0;color:rgba(255,255,255,.85);font-weight:700;font-size:14px;cursor:pointer;padding:10px 6px}
.sp-hint{position:absolute;z-index:3;top:calc(env(safe-area-inset-top) + 70px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#fff;color:var(--red-d);border:0;border-radius:var(--r-m);padding:11px 18px 11px 14px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;box-shadow:0 12px 28px -10px rgba(0,0,0,.6)}
.sp-hint[hidden]{display:none}
.sp-text{position:absolute;left:0;right:0;top:27%;text-align:center;z-index:2}
.sp-word{display:inline-block;color:#fff;font-family:var(--display);font-weight:700;font-size:clamp(38px,13vw,58px);letter-spacing:-.02em;line-height:1.1;clip-path:inset(0 100% 0 0);animation:spreveal 3.2s linear forwards}
@keyframes spreveal{0%,32%{clip-path:inset(0 100% 0 0)}82%,100%{clip-path:inset(0 -6% 0 0)}}
.sp-sub{margin-top:10px;color:rgba(255,255,255,.8);font-weight:600;opacity:0;animation:spin .6s 3.1s forwards}
@keyframes spin{to{opacity:1}}
.sp-flake{position:absolute;top:-12px;border-radius:50%;background:#fff;animation:spfall linear infinite;pointer-events:none}
@keyframes spfall{to{transform:translate(24px,112vh)}}
.sp-ground{position:absolute;left:0;right:0;bottom:0;width:100%;height:150px;display:block}
.sp-run{position:absolute;left:0;bottom:66px;width:150px;height:170px;z-index:2;transform:translateX(-170px);animation:sprun 3.2s linear forwards}
@keyframes sprun{from{transform:translateX(-170px)}to{transform:translateX(100vw)}}
.sp-run .ded{width:150px;height:170px;display:block;overflow:visible}
/* прыжок: один прыжок = одна доля музыки (0,35 с), приземление совпадает с «шагом» в звуке */
.ded .hop{transform-origin:78px 160px;animation:dhop .35s ease-in-out infinite;animation-delay:-.3s}
@keyframes dhop{0%,100%{transform:translateY(0) scale(1.08,.9)}50%{transform:translateY(-16px) scale(.95,1.07)}}
.ded .shadow{transform-origin:78px 162px;animation:dsh .35s ease-in-out infinite;animation-delay:-.3s}
@keyframes dsh{0%,100%{transform:scale(1.05);opacity:.28}50%{transform:scale(.68);opacity:.12}}
.ded .legB{transform-origin:70px 132px;animation:dlegs .175s linear infinite alternate}
.ded .legF{transform-origin:94px 132px;animation:dlegs .175s linear infinite alternate-reverse}
@keyframes dlegs{from{transform:rotate(-48deg)}to{transform:rotate(48deg)}}
.ded .sack{transform-origin:58px 80px;animation:dsack .35s ease-in-out infinite;animation-delay:-.2s}
@keyframes dsack{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg) translateY(-4px)}}
.ded .pom{transform-origin:62px 22px;animation:dpom .35s ease-in-out infinite;animation-delay:-.1s}
@keyframes dpom{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(12deg)}}
.ded .beard{transform-origin:84px 62px;animation:dbeard .35s ease-in-out infinite;animation-delay:-.05s}
@keyframes dbeard{0%,100%{transform:rotate(-6deg) scaleY(1)}50%{transform:rotate(5deg) scaleY(1.06)}}
.ded .mouth{transform-origin:88px 73px;animation:dmouth .175s ease-in-out infinite alternate}
@keyframes dmouth{from{transform:scaleY(.55)}to{transform:scaleY(1.1)}}
.ded .eyes{transform-origin:87px 50px;animation:dblink 1.2s infinite}
@keyframes dblink{0%,88%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
.ded .armF{transform-origin:97px 86px;animation:darm .175s ease-in-out infinite alternate}
@keyframes darm{from{transform:rotate(10deg)}to{transform:rotate(-14deg)}}
.ded .sackgift{animation:dgone .01s 1s forwards}
@keyframes dgone{to{opacity:0}}
.sp-say{position:absolute;left:92px;top:-18px;background:#fff;color:var(--burg);font-weight:800;font-size:13px;padding:6px 12px;border-radius:12px;white-space:nowrap;transform-origin:0 100%;opacity:0;animation:dsay 1.7s .3s both}
.sp-say::after{content:"";position:absolute;left:12px;bottom:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes dsay{0%{opacity:0;transform:scale(0)}9%{opacity:1;transform:scale(1.18)}15%{transform:scale(1)}82%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.8) translateY(-6px)}}
.sp-line{position:absolute;left:-26px;height:3px;border-radius:2px;background:rgba(255,255,255,.55);animation:dline .175s linear infinite}
@keyframes dline{from{transform:translateX(10px);opacity:0}30%{opacity:1}to{transform:translateX(-14px);opacity:0}}
.sp-gift{position:absolute;left:calc((100vw + 170px) * .3125 - 143px);bottom:184px;width:22px;height:22px;opacity:0;z-index:2;animation:dgift 1s 1s forwards}
@keyframes dgift{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.5)}6%{opacity:1;transform:translate(-4px,-8px) rotate(-30deg) scale(1)}30%{transform:translate(-10px,106px) rotate(-170deg)}44%{transform:translate(-14px,76px) rotate(-210deg)}58%{transform:translate(-18px,106px) rotate(-250deg)}70%{transform:translate(-20px,94px) rotate(-262deg)}82%{transform:translate(-22px,106px) rotate(-270deg)}100%{opacity:1;transform:translate(-22px,106px) rotate(-270deg)}}
.sp-puff{position:absolute;bottom:6px;left:20px;border-radius:50%;background:#fff;opacity:0;animation:sppuff .35s ease-out infinite}
@keyframes sppuff{0%{opacity:.8;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(-34px,-14px) scale(1.4)}}
@media (prefers-reduced-motion:reduce){
  .sp-word{animation:none;clip-path:none}
  .sp-sub{animation:none;opacity:1}
  .sp-run{animation:none;transform:translateX(calc(50vw - 75px))}
  .ded *,.sp-flake,.sp-puff,.sp-line{animation:none!important}
  .sp-say,.sp-gift,.sp-line{display:none}
}

<script>
/* ============ НАСТРОЙКИ ============ */
// Настройки лежат в самом верху файла, в строках <meta name="happygift:...">. Здесь они только читаются и проверяются.
function cfg(n){ const m = document.querySelector('meta[name="happygift:'+n+'"]'); return m ? String(m.getAttribute('content')||'').trim() : ''; }
function safeUrl(u, host){ try { const x = new URL(u); return (x.protocol === 'https:' && !x.username && !x.password && (!host || x.hostname === host)) ? x.href : ''; } catch(e){ return ''; } }
const BOT_LINK = safeUrl(cfg('bot'), 't.me').replace(/[?#].*$/,'').replace(/\/$/,'');
const DONATE_URL = safeUrl(cfg('donate'));
function serverUrl(){ const u = safeUrl(cfg('server'), 'functions.yandexcloud.net'); try { return /^\/[a-z0-9]{10,40}\/?$/.test(new URL(u).pathname) ? u.replace(/[?#].*$/, '').replace(/\/$/, '') : ''; } catch(e){ return ''; } }
const SERVER_URL = serverUrl();
const SRV = !!SERVER_URL;
const TEST_MODE = cfg('test') === 'on' && !SRV;
const DONATE_KEY = 'happygift_donate_until';

/* ============ TELEGRAM ============ */

if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#4A0614'); tg.setBackgroundColor('#4A0614'); } catch(e){} }
const tgUser = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && Number.isSafeInteger(tg.initDataUnsafe.user.id) && tg.initDataUnsafe.user.id > 0) ? tg.initDataUnsafe.user : null;

/* ============ АВАТАРКИ (временные, позже заменим на ваши) ============ */
const AV = {
  fox:{n:'Лиса',bg:'#FFD9B8',svg:'<polygon points="10,10 26,22 12,32" fill="#E8742C"/><polygon points="54,10 38,22 52,32" fill="#E8742C"/><ellipse cx="32" cy="36" rx="21" ry="19" fill="#F28C3C"/><path d="M11 38 Q32 62 53 38 Q44 50 32 50 Q20 50 11 38Z" fill="#FFF3E6"/><circle cx="24" cy="34" r="2.4" fill="#2A1A14"/><circle cx="40" cy="34" r="2.4" fill="#2A1A14"/><ellipse cx="32" cy="46" rx="3" ry="2.2" fill="#2A1A14"/>'},

  owl:{n:'Сова',bg:'#C9DDF7',svg:'<polygon points="14,12 26,20 12,28" fill="#7A5A40"/><polygon points="50,12 38,20 52,28" fill="#7A5A40"/><ellipse cx="32" cy="38" rx="21" ry="21" fill="#8F6B4C"/><ellipse cx="32" cy="47" rx="12" ry="11" fill="#D9BF9C"/><circle cx="23" cy="32" r="9" fill="#FFF7E6"/><circle cx="41" cy="32" r="9" fill="#FFF7E6"/><circle cx="23" cy="32" r="4" fill="#2A1A14"/><circle cx="41" cy="32" r="4" fill="#2A1A14"/><circle cx="24.2" cy="30.8" r="1.2" fill="#fff"/><circle cx="42.2" cy="30.8" r="1.2" fill="#fff"/><polygon points="29,38 35,38 32,44" fill="#F2A93B"/>'},
  penguin:{n:'Пингвин',bg:'#BFE3F2',svg:'<ellipse cx="32" cy="38" rx="21" ry="24" fill="#2B3350"/><ellipse cx="32" cy="43" rx="14" ry="17" fill="#F4F6FF"/><circle cx="25" cy="32" r="2.4" fill="#12152B"/><circle cx="39" cy="32" r="2.4" fill="#12152B"/><polygon points="28,37 36,37 32,43" fill="#F2A93B"/><circle cx="18" cy="38" r="3" fill="#F29AB0" opacity=".6"/><circle cx="46" cy="38" r="3" fill="#F29AB0" opacity=".6"/>'},
  deer:{n:'Олень',bg:'#F6CBD6',svg:'<path d="M20 20 L14 6 M17 13 L9 11 M17 13 L19 5 M44 20 L50 6 M47 13 L55 11 M47 13 L45 5" stroke="#7A5233" stroke-width="3" stroke-linecap="round" fill="none"/><ellipse cx="13" cy="28" rx="6" ry="4" transform="rotate(-25 13 28)" fill="#B87A48"/><ellipse cx="51" cy="28" rx="6" ry="4" transform="rotate(25 51 28)" fill="#B87A48"/><ellipse cx="32" cy="38" rx="17" ry="19" fill="#C48A55"/><ellipse cx="32" cy="48" rx="10" ry="8" fill="#EBCFAA"/><circle cx="32" cy="46" r="4" fill="#D42A58"/><circle cx="25" cy="34" r="2.3" fill="#2A1A14"/><circle cx="39" cy="34" r="2.3" fill="#2A1A14"/>'},
  panda:{n:'Панда',bg:'#D3EBC8',svg:'<circle cx="14" cy="16" r="8" fill="#1E2236"/><circle cx="50" cy="16" r="8" fill="#1E2236"/><circle cx="32" cy="36" r="21" fill="#F7F7FB"/><ellipse cx="23" cy="33" rx="5.5" ry="7" transform="rotate(20 23 33)" fill="#1E2236"/><ellipse cx="41" cy="33" rx="5.5" ry="7" transform="rotate(-20 41 33)" fill="#1E2236"/><circle cx="24" cy="32" r="1.8" fill="#fff"/><circle cx="40" cy="32" r="1.8" fill="#fff"/><ellipse cx="32" cy="43" rx="3.6" ry="2.6" fill="#1E2236"/><path d="M28 47 Q32 50 36 47" stroke="#1E2236" stroke-width="1.6" fill="none" stroke-linecap="round"/>'}
};
const AV_KEYS = Object.keys(AV);
function avatar(key, size){
  const a = AV[key] || AV.fox;
  return '<span class="av" style="--s:'+(size||48)+'px;background:'+a.bg+'"><svg viewBox="0 0 64 64" aria-hidden="true">'+a.svg+'</svg></span>';
}

/* ============ ХРАНИЛИЩЕ (на этом шаге локально, на телефоне) ============ */
const KEY = 'secret_santa_v1';
let mem = null;
function fresh(){ return {users:Object.create(null), groups:Object.create(null), meId:null}; }
function load(){
  try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch(e){}
  return mem || null;
}
let db = fresh();
let saveWarned = false;
function save(){
  if (SRV){ queueSeen(); return; }
  mem = db;
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ if (!saveWarned && typeof toast === 'function'){ saveWarned = true; setTimeout(() => toast('Память телефона заполнена, данные могут не сохраниться'), 0); } }
}
function rid(p){ const a = new Uint32Array(2); crypto.getRandomValues(a); return p + (a[0].toString(36) + a[1].toString(36)).slice(0,12); }

/* ============ СОСТОЯНИЕ ИНТЕРФЕЙСА ============ */

const MAX_EDITS = 2;
ui.cardOpen = {};
function freshDemo(){ return {order:['fox','bear','rabbit','owl'], tag:false, copied:false, left:2, pop:false, q:null}; }

const myId = () => ui.viewAs || db.meId;

const pl = (n,a,b,c) => { const m=n%10, h=n%100; return (m===1&&h!==11)?a:(m>=2&&m<=4&&(h<10||h>=20))?b:c; };
const METHOD = { meet:'Лично', ship:'Доставкой' };
const PVZ = { ozon:'Ozon', cdek:'СДЭК', yandex:'Яндекс Маркет', other:'Другой' };

function go(screen, extra){
  ui.screen = screen; ui.error = '';
  if (extra) Object.assign(ui, extra);
  render(); window.scrollTo(0,0);
  const app = document.getElementById('app'); app.classList.remove('enter'); void app.offsetWidth; app.classList.add('enter');
}
function whenInfo(g){
  if (!g || !g.date) return null;
  const d = new Date(g.date+'T00:00'), t = new Date(); t.setHours(0,0,0,0);
  if (isNaN(d)) return null;
  const n = Math.round((d - t) / 86400000), ds = d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  return {n, ds, left: n > 1 ? 'через ' + n + ' ' + pl(n,'день','дня','дней') : n === 1 ? 'завтра' : n === 0 ? 'сегодня' : ''};
}
function hap(kind){ try { const h = tg && tg.HapticFeedback; if (!h) return; if (kind === 'ok') h.notificationOccurred('success'); else if (kind === 'err') h.notificationOccurred('error'); else h.impactOccurred('light'); } catch(e){} }
function segInfo(g, id){
  const w = thread(g, g.assign[id]), sn = thread(g, id), req = (g.parcels||{})[g.assign[id]];
  return {
    ward: w.m.slice(w.seenS).filter(x => x.r !== 's').length + (req && req.requested ? 1 : 0),
    santa: sn.m.slice(sn.seenW).filter(x => x.r !== 'w').length + ((g.quiz||{})[id] || []).filter(x => x.a == null).length + (((g.cards||{})[id] && !ui.cardOpen[g.id+':'+id]) ? 1 : 0)
  };
}
function focusField(id){ const el = document.getElementById(id); if (el){ el.scrollIntoView({block:'center'}); el.focus({preventScroll:true}); } }
function toast(t){ ui.toast = t; renderLayer(); clearTimeout(toast._t); toast._t = setTimeout(()=>{ ui.toast=''; renderLayer(); }, 2200); }

/* ============ ЛОГИКА ============ */
function randInt(n){ const a = new Uint32Array(1), lim = Math.floor(4294967296 / n) * n; do { crypto.getRandomValues(a); } while (a[0] >= lim); return a[0] % n; }
function shuffle(arr){ const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j=randInt(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newCode(){
  const abc='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c;
  do { c=''; for (let i=0;i<6;i++) c+=abc[randInt(abc.length)]; } while (Object.values(db.groups).some(g=>g.code===c));
  return c;
}
function doDraw(g){
  // Круги из запретных пар и способа обмена: каждый дарит следующему в своём круге, себе не достаётся никто.
  const plan = planDraw(g); if (!plan) return false;
  const assign = {};
  plan.cycles.forEach(c => c.forEach((id,i) => { assign[id] = c[(i+1)%c.length]; }));
  const keys = shuffle(AV_KEYS.slice()), alias = {};
  Object.keys(assign).forEach((giver,i) => { alias[assign[giver]] = keys[i % keys.length]; });
  g.assign = assign; g.alias = alias; g.drawn = true; g.drawnAt = Date.now(); g.mode = plan.mode; g.progress = {};
  return true;
}
function cleanCode(c){ c = String(c == null ? '' : c).trim().toUpperCase(); return /^[A-Z2-9]{6}$/.test(c) ? c : ''; }
function inviteLink(g){
  if (BOT_LINK) return BOT_LINK + '?startapp=join_' + g.code;
  return location.href.split('#')[0].split('?')[0] + '?join=' + g.code;
}
function joinGroup(code){
  code = cleanCode(code);
  const g = code ? Object.values(db.groups).find(x=>x.code===code) : null;
  if (!g){ ui.error='Группа с таким кодом не найдена. Проверьте код.'; render(); return; }
  const id = myId();
  if (!g.members.includes(id)){
    if (g.drawn){ ui.error='В этой группе жеребьёвка уже прошла.'; render(); return; }
    g.members.push(id); save();
  }
  go('group', {groupId:g.id});
}

function banSet(g){ const b = new Set(); (g.exclude||[]).forEach(p => { b.add(p[0]+'|'+p[1]); b.add(p[1]+'|'+p[0]); }); return b; }

  const n = ids.length; if (n < 3) return null;
  for (let attempt=0; attempt<30; attempt++){
    const path = [], used = new Set(); let steps = 0;
    const first = ids[randInt(n)]; path.push(first); used.add(first);
    const dfs = () => {
      if (path.length === n) return !banned.has(path[n-1]+'|'+path[0]);
      if (++steps > 4000) return false;
      const last = path[path.length-1];
      const cand = shuffle(ids.filter(x => !used.has(x) && !banned.has(last+'|'+x)));
      for (const c of cand){ used.add(c); path.push(c); if (dfs()) return true; path.pop(); used.delete(c); if (steps > 4000) return false; }
      return false;
    };
    if (dfs()) return path;
  }

}

}

    const meet = members.filter(id => !(db.users[id] && db.users[id].method === 'ship'));
    const ship = members.filter(id => db.users[id] && db.users[id].method === 'ship');
    if (meet.length >= 3 && ship.length >= 3){
      const a = buildCycle(meet, banned), b = buildCycle(ship, banned);
      if (a && b) return {cycles:[a,b], mode:'split'};
    } else if (meet.length && ship.length){
      const c = groupedCycle(meet, ship, banned);
      if (c) return {cycles:[c], mode:'grouped'};

function treePoints(n){
  if (n <= 0) return {pts:[], r:6};
  const R = Math.max(1, Math.min(8, Math.ceil(Math.sqrt(n*1.25)), n));
  const rows = [];
  for (let j=0;j<R;j++){ const y = R===1 ? 136 : 84 + 122*j/(R-1); rows.push({y, w:Math.max(6, treeHalf(y)-13)}); }
  const tot = rows.reduce((a,r)=>a+r.w, 0);

  let left = n - cnt.reduce((a,b)=>a+b, 0);
  const rema = rows.map((r,i) => [n*r.w/tot - cnt[i], i]).sort((a,b)=>b[0]-a[0]);
  for (let k=0; left>0; k++, left--) cnt[rema[k % R][1]]++;
  const pts = []; let minSp = 99;
  rows.forEach((r,j) => { const c = cnt[j]; if (c > 1) minSp = Math.min(minSp, 2*r.w/c);
    for (let i=0;i<c;i++){ const x = c===1 ? TREE_CX : TREE_CX - r.w + 2*r.w*(i+0.5)/c; pts.push([x, r.y + (i%2 ? -3 : 3)]); } });

/* ---- анонимная переписка ---- */
function thread(g, key){ g.chats = g.chats || {}; return g.chats[key] = g.chats[key] || {m:[], seenS:0, seenW:0}; }
function pushMsg(g, key, role, text){ thread(g,key).m.push({r:role, t:text, at:Date.now()}); }
function chatSection(g){
  const id = myId(), wardId = g.assign[id], ward = db.users[wardId];
  const tabs = [
    {k:'ward',  label: (ward && ui.revealed[g.id+':'+id]) ? 'Подопечный: ' + ward.name : 'Подопечный', key:wardId, me:'s', seen:'seenS', other:'Подопечный'},
    {k:'santa', label:'Мой Санта',                              key:id,     me:'w', seen:'seenW', other:'Тайный Санта'}
  ];
  const cur = ui.chatTab === 'santa' ? 'santa' : 'ward';
  tabs.forEach(t => { const th = thread(g, t.key); t.th = th; t.unread = th.m.slice(th[t.seen]).filter(x => x.r !== t.me).length; });
  const c = tabs.find(t => t.k === cur);
  const aliasKey = aliasOf(g, c.key), aliasName = secretName(aliasKey);
  c.other = c.k === 'santa' ? aliasName : 'Подопечный';
  if (c.th[c.seen] !== c.th.m.length){ c.th[c.seen] = c.th.m.length; save(); }
  const fmt = at => { const d = new Date(at), today = new Date().toDateString() === d.toDateString();
    return today ? d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}) : d.toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); };
  return `<div class="chat">
    <div class="chat-h">${ic('lock',20)}<h3>${cur==='ward' ? 'Переписка с подопечным' : 'Переписка с Сантой'}</h3></div>
    <p class="small muted" style="margin-top:6px">Имена скрыты с обеих сторон. Не пишите то, что выдаст вас.</p>
    <div class="whoami">${avatar(aliasKey,28)}<span>${c.k==='ward' ? 'Вы пишете как <b>'+aliasName+'</b>' : 'Вам пишет <b>'+aliasName+'</b>'}</span></div>
    <div class="chatlog" id="chatlog" tabindex="0" aria-label="Сообщения">
      ${c.th.m.length ? c.th.m.map(m => `<div class="msg ${m.r===c.me?'me':'them'}">${esc(m.t)}<time>${m.r===c.me?'Вы':c.other}, ${fmt(m.at)}</time></div>`).join('')
        : `<p class="muted small" style="text-align:center;padding:18px 0">${cur==='ward' ? 'Спросите, что подарить, или уточните детали. Подопечный не узнает, кто вы.' : 'Здесь можно задать вопрос своему Санте или подсказать, что вам нравится.'}</p>`}
    </div>
    <form class="chatform" data-form="chat">
      <input class="in" id="msg" data-f="msg" maxlength="500" autocomplete="off" aria-label="Сообщение" placeholder="Напишите сообщение" value="${esc(ui.draft.msg)}">
      <button class="sendbtn" type="submit" aria-label="Отправить">${ic('send',22)}</button>
    </form>
  </div>`;
}

/* ============ РЕНДЕР ============ */

}
try { if (tg && tg.BackButton) tg.BackButton.onClick(() => { if (ui.zoom){ A.closeZoom(); return; } if (ui.modal){ A.closeModal(); return; } const b = document.querySelector('#app .top [aria-label="Назад"]'); if (b) b.click(); }); } catch(e){}
function donateSnoozed(){ try { return Number(localStorage.getItem(DONATE_KEY) || 0) > Date.now(); } catch(e){ return false; } }
function donateSnooze(days){ try { localStorage.setItem(DONATE_KEY, String(Date.now() + days*86400000)); } catch(e){} }
function maybeDonate(scr){
  const g = scr === 'group' ? db.groups[ui.groupId] : null;
  if (!(g && g.drawn)) { ui.donate = false; clearTimeout(maybeDonate._t); maybeDonate._t = 0; return; }
  if (!DONATE_URL || ui.donate || ui.donateDone || ui.viewAs || donateSnoozed() || maybeDonate._t) return;
  maybeDonate._t = setTimeout(() => { maybeDonate._t = 0; if (ui.screen === 'group' && !ui.viewAs && !ui.modal){ ui.donate = true; ui.donateDone = true; renderLayer(); } }, 6000);
}
function renderLayer(){
  let h = '';

    <button class="btn" data-a="${ui.modal.ok}">${esc(ui.modal.okLabel)}</button>
    <button class="btn ghost" data-a="closeModal">Отмена</button></div></div>`;

/* ============ ДЕЙСТВИЯ ============ */
const A = {
  go(el){
    const to = el.dataset.to; ui.draft = {};
    if (to === 'home') ui.after = null;
    if (!me() && (to === 'create' || to === 'join')){ ui.after = to; ui.draft = {name:(tgUser && tgUser.first_name) || ''}; go('onboard'); return; }
    go(to);
  },
  editProfile(){ if (ui.viewAs){ toast('В режиме просмотра профиль не меняется'); return; } const u = me() || {name:(tgUser && tgUser.first_name) || ''}; ui.draft = {name:u.name, avatar:u.avatar, method:u.method, pvz:u.pvz||'', pvzOther:u.pvz==='other'?(u.pvzName||''):'', addr:u.addr||'', wishes:u.wishes||'', likes:(u.likes||[]).slice(), dislikes:(u.dislikes||[]).slice(), colors:(u.colors||[]).slice(), sizeC:u.sizeC||'', sizeS:u.sizeS||''}; go('onboard'); },
  pickAvatar(el){ if (AV_KEYS.includes(el.dataset.v)){ ui.draft.avatar = el.dataset.v; render(); } },
  pickMethod(el){ if (el.dataset.v === 'meet' || el.dataset.v === 'ship'){ ui.draft.method = el.dataset.v; render(); } },
  pickPvz(el){ if (Object.keys(PVZ).includes(el.dataset.v)){ ui.draft.pvz = el.dataset.v; render(); } },
  saveProfile(){
    const d = ui.draft, name = (d.name||'').trim();
    if (!name){ ui.error='Напишите, как вас называть.'; render(); focusField('f-name'); return; }
    if (!d.avatar){ ui.error='Выберите зверя.'; render(); return; }
    if (!d.method){ ui.error='Выберите, как удобнее обменяться подарками.'; render(); return; }
    if (d.method==='ship'){
      if (!d.pvz){ ui.error='Выберите пункт выдачи.'; render(); return; }
      if (d.pvz==='other' && !(d.pvzOther||'').trim()){ ui.error='Напишите название пункта выдачи.'; render(); focusField('f-pvzo'); return; }
      if (!(d.addr||'').trim()){ ui.error='Укажите адрес ближайшего пункта.'; render(); focusField('f-addr'); return; }
    }
    if (!db.users[db.meId] && !d.agree){ ui.error='Отметьте, что принимаете правила сервиса.'; render(); focusField('f-agree'); return; }
    const raw = {name, avatar:d.avatar, method:d.method, pvz: d.method==='ship' ? d.pvz : '', pvzName: d.method==='ship' ? (d.pvz==='other' ? d.pvzOther.trim() : PVZ[d.pvz]) : '', addr: d.method==='ship' ? d.addr.trim() : '', wishes:(d.wishes||'').trim(), likes:(d.likes||[]).slice(), dislikes:(d.dislikes||[]).slice(), colors:(d.colors||[]).slice(), sizeC:d.sizeC||'', sizeS:d.sizeS||''};
    const rec = cleanUser(raw, db.meId); if (!rec){ ui.error='Проверьте, что всё заполнено.'; render(); return; }
    delete rec.id; delete rec.edits;
    const prev = db.users[db.meId];
    if (prev){
      const used = prev.edits || 0;
      if (used >= MAX_EDITS){ toast('Данные закрыты, менять их больше нельзя'); return; }
      const nrm = v => Array.isArray(v) ? v.slice().sort().join('|') : (v||'');
      if (!['name','avatar','method','pvz','pvzName','addr','wishes','likes','dislikes','colors','sizeC','sizeS'].some(k => nrm(prev[k]) !== nrm(rec[k]))){ ui.draft = {}; go('home'); toast('Изменений нет, попытка не потрачена'); return; }
      ui.pendingRec = rec;
      ui.modal = {title:'Сохранить изменения?', text: 'Это изменение ' + (used+1) + ' из ' + MAX_EDITS + '. ' + (used+1 < MAX_EDITS ? 'После него можно будет изменить данные ещё один раз.' : 'После него данные закроются, менять их будет нельзя.'), ok:'confirmProfile', okLabel:'Сохранить'};
      renderLayer(); return;
    }
    db.users[db.meId] = Object.assign({id:db.meId, edits:0}, rec, {rules:RULES_VER, rulesAt:Date.now()});
    save(); ui.draft = {};
    if (ui.pendingJoin){ const c = ui.pendingJoin; ui.pendingJoin = null; joinGroup(c); }
    else if (ui.after){ const t = ui.after; ui.after = null; go(t); }
    else go('home');
  },
  confirmProfile(){
    const prev = db.users[db.meId], rec = ui.pendingRec;
    ui.modal = null; ui.pendingRec = null;
    if (!prev || !rec || (prev.edits||0) >= MAX_EDITS){ renderLayer(); return; }
    db.users[db.meId] = Object.assign({}, prev, rec, {edits:(prev.edits||0)+1, editedAt:Date.now()});
    save(); ui.draft = {}; go('home'); toast('Данные обновлены');
  },
  startOnboard(){ ui.draft = {name:(tgUser && tgUser.first_name) || ''}; ui.after = null; go('onboard'); },
  openGuide(el){ const v = el && el.dataset && el.dataset.v; ui.guide = {role: v || (ui.pendingJoin ? 'part' : 'org'), i:0, anim:false}; ui.demo = freshDemo(); go('guide'); },
  guideRole(el){ ui.guide = {role:el.dataset.v, i:0, anim:true}; ui.demo = freshDemo(); render(); ui.guide.anim = false; window.scrollTo(0,0); },
  guideNext(){

  guideClose(){ const u = db.users[db.meId]; if (u){ u.guideSeen = true; save(); } go(u ? 'home' : 'welcome'); },
  demoShuffle(){ ui.demo.order = shuffle(['fox','bear','rabbit','owl']); ui.demo.pop = true; render(); ui.demo.pop = false; },

  askQ(el){

    if (!wardId || !QUIZ.some(q => q.id === el.dataset.v)) return;

  },
  answerQ(el){
    const g = db.groups[ui.groupId]; if (!g) return;
    const x = ((g.quiz||{})[myId()] || []).find(z => z.id === el.dataset.q), q = x && QUIZ.find(z => z.id === x.id), v = +el.dataset.v;
    if (q && x.a == null && Number.isInteger(v) && v >= 0 && v < q.o.length){ x.a = +el.dataset.v; x.ansAt = Date.now(); save(); render(); toast('Ответ отправлен'); }
  },
  pickCard(el){ if (CARDS.some(c => c.id === el.dataset.v)){ ui.draft.cardTpl = el.dataset.v; render(); } },
  sendCard(){
    const g = db.groups[ui.groupId], wardId = g && g.drawn && g.assign[myId()], txt = cStr(ui.draft.cardText, 120).trim();

    g.cards = g.cards || {}; g.cards[wardId] = {tpl: cPick(ui.draft.cardTpl, CARDS.map(c => c.id)) || 'snow', text: txt, at: Date.now()};

  },
  openCard(){ ui.cardOpen[ui.groupId+':'+myId()] = true; render(); },
  exAdd(){
    const g = db.groups[ui.groupId], a = ui.draft.exA, b = ui.draft.exB;
    if (!g || g.drawn || g.adminId !== myId()) return;
    g.exclude = g.exclude || [];
    if (!a || !b || a === b || !g.members.includes(a) || !g.members.includes(b)){ toast('Выберите двух разных участников'); return; }
    if (g.exclude.some(p => (p[0]===a && p[1]===b) || (p[0]===b && p[1]===a))){ toast('Такая пара уже есть'); return; }
    g.exclude.push([a,b]); ui.draft.exA = ''; ui.draft.exB = ''; save(); render();
  },
  exDel(el){ const g = db.groups[ui.groupId], i = +el.dataset.i; if (!g || g.drawn || g.adminId !== myId() || !Number.isInteger(i) || i < 0) return; (g.exclude||[]).splice(i, 1); save(); render(); },
  toggleTag(el){
    const k = el.dataset.k === 'likes' ? 'likes' : 'dislikes', other = k === 'likes' ? 'dislikes' : 'likes', v = el.dataset.v, d = ui.draft;
    if (!(k === 'likes' ? LIKE_TAGS : DISLIKE_TAGS).includes(v)) return;

  toggleColor(el){ if (!COLORS.some(c => c.k === el.dataset.v)) return; const d = ui.draft; d.colors = d.colors || []; const i = d.colors.indexOf(el.dataset.v); if (i >= 0) d.colors.splice(i,1); else d.colors.push(el.dataset.v); render(); },

function readImage(file){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        if (!im.width || !im.height || im.width*im.height > 40e6){ rej(); return; }
        let out = '';
        for (const [side, q] of [[1000,.88],[1000,.75],[850,.7],[700,.65],[600,.6]]){
          const k = Math.min(1, side/Math.max(im.width, im.height));
          const c = document.createElement('canvas'); c.width = Math.round(im.width*k); c.height = Math.round(im.height*k);
          const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height);
          out = c.toDataURL('image/jpeg', q);
          if (out.length < 600000) break;
        }
        res(out);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ============ ЗВУК: перезвон бубенцов ============
   Что учтено (слух и мозг):
   1) Ухо резче всего слышит 2-5 кГц, там же звук «режет»: основные тоны ниже (1-2 кГц), верх срезан фильтром.
   2) Близкие, но не совпадающие по высоте тоны дают «биения» (грубость): все ноты из одной мажорной пентатоники, обертоны кратны.
   3) Резкий громкий старт вызывает рефлекс испуга: звук плавно нарастает за 0,15 с, атака мягкая.
   4) Мажор, быстрый темп, восходящая линия воспринимаются как радость.
   5) Ожидание и разрядка: ускоряющаяся «дробь», короткая пауза и чистый финальный аккорд.
   6) Простор: лёгкое «эхо комнаты», звук движется слева направо вместе с дедом. */
const audio = {ctx:null, master:null, started:false, pref:true};
const splash = {timer:null, active:false};
function soundOn(){ try { return localStorage.getItem('ss_sound') !== '0'; } catch(e){ return audio.pref; } }
function setSound(v){
  audio.pref = v; try { localStorage.setItem('ss_sound', v ? '1' : '0'); } catch(e){}
  if (audio.master) audio.master.gain.value = v ? 0.9 : 0;
}
const midiHz = n => 440 * Math.pow(2, (n - 69) / 12);
const STEP = 0.35; // один прыжок деда = одна доля
// настроенный колокольчик: основной тон, октавы и крошечная «металличность»
function bellTone(ctx, dest, note, t, dur, vol){
  [[1,1,1],[2,.28,.5],[4,.1,.3],[2.76,.05,.22]].forEach(p => {
    const f = midiHz(note) * p[0]; if (f > 9000) return;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol * p[1], t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur * p[2]);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
  });
}
// мягкий «шлёп» шага: короткий тон с падающей высотой
function bop(ctx, dest, t, vol){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(300, t + 0.09);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.2);
}
// встряска бубенцов: тихий воздушный шелест 3-7,5 кГц и один чистый звон из пентатоники
function shimmer(ctx, dest, nb, t, v){
  const s = ctx.createBufferSource(); s.buffer = nb;
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3200;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7500;
  const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.03 * v, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  s.connect(hp); hp.connect(lp); lp.connect(g); g.connect(dest); s.start(t); s.stop(t + 0.1);
  const notes = [91, 96, 100];
  bellTone(ctx, dest, notes[Math.floor(Math.random() * 3)], t + (Math.random() - 0.5) * 0.006, 0.16, 0.022 * v);
}
function makeReverb(ctx){
  const len = Math.floor(ctx.sampleRate * 1.1), ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++){
    const d = ir.getChannelData(ch); let lp = 0;
    for (let i = 0; i < len; i++){ lp += ((Math.random() * 2 - 1) - lp) * 0.35; d[i] = lp * Math.exp(-i / (ctx.sampleRate * 0.26)); }
  }
  return ir;
}
// около 3,9 секунды
function scheduleJingle(ctx, dest, t0){
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3; comp.knee.value = 12; comp.attack.value = 0.005; comp.release.value = 0.15; comp.connect(dest);
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7500; lp.Q.value = 0.5; lp.connect(comp);
  let out = lp;
  if (ctx.createStereoPanner){
    const pan = ctx.createStereoPanner(); pan.pan.setValueAtTime(-0.7, t0); pan.pan.linearRampToValueAtTime(0.7, t0 + 3.0); pan.connect(lp); out = pan;
  }
  const bus = ctx.createGain(); bus.gain.setValueAtTime(0.0001, t0); bus.gain.linearRampToValueAtTime(1, t0 + 0.15); bus.connect(out);
  const conv = ctx.createConvolver(); conv.buffer = makeReverb(ctx);
  const wet = ctx.createGain(); wet.gain.value = 0.3; bus.connect(conv); conv.connect(wet); wet.connect(out);
  const nb = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.1), ctx.sampleRate), nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  const vh = () => 0.92 + Math.random() * 0.16;   // лёгкая «живость» громкости
  // шаги деда: мягкие «боп» на каждом приземлении
  for (let k = 0; k <= 7; k++) bop(ctx, bus, t0 + 0.05 + STEP * k, 0.055);
  // 1) предвкушение: восходящий «разгон» из пентатоники и ускоряющаяся дробь бубенцов
  [79, 81, 84, 86, 88, 91].forEach((n, i) => bellTone(ctx, bus, n, t0 + [0.12,0.25,0.37,0.48,0.58,0.67][i], 0.5, 0.03 + i * 0.008));
  let t = 0;
  for (let k = 0; k < 14; k++){ shimmer(ctx, bus, nb, t0 + t, (0.35 + k * 0.05) * vh()); t += 0.07 - k * 0.0024; }
  // 2) главный мотив: E G A G, поверх ритм бубенцов «раз-и-два»
  const motif = [88, 91, 93, 91], g0 = 0.75;
  for (let c = 0; c < 4; c++){
    const tc = g0 + c * STEP;
    shimmer(ctx, bus, nb, t0 + tc, 0.9 * vh()); shimmer(ctx, bus, nb, t0 + tc + STEP / 3, 0.45 * vh()); shimmer(ctx, bus, nb, t0 + tc + 2 * STEP / 3, 0.6 * vh());
    bellTone(ctx, bus, motif[c], t0 + tc, 0.7, 0.11 * vh());
    bellTone(ctx, bus, motif[c] - 12, t0 + tc, 0.8, 0.05);
  }
  // тёплая подложка (до и соль), нарастает и держится до финала
  [72, 79].forEach(n => {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine'; o.frequency.value = midiHz(n);
    g.gain.setValueAtTime(0.0001, t0 + 0.6); g.gain.linearRampToValueAtTime(0.03, t0 + 1.2); g.gain.setValueAtTime(0.03, t0 + 2.5); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.8);
    o.connect(g); g.connect(bus); o.start(t0 + 0.6); o.stop(t0 + 3.85);
  });
  // подарок выпал из мешка: три затихающих «тинь»
  bellTone(ctx, bus, 96, t0 + 1.3, 0.5, 0.05); bellTone(ctx, bus, 100, t0 + 1.58, 0.5, 0.035); bellTone(ctx, bus, 103, t0 + 1.82, 0.5, 0.025);
  // 3) короткая пауза (предвкушение) и чистый финальный аккорд до-мажор с добавленной секундой
  const fin = 2.5;
  [84, 88, 91, 96].forEach(n => bellTone(ctx, bus, n, t0 + fin, 1.4, 0.12));
  bellTone(ctx, bus, 98, t0 + fin, 1.2, 0.05); bellTone(ctx, bus, 72, t0 + fin, 1.5, 0.07);
  for (let k = 0; k < 4; k++) shimmer(ctx, bus, nb, t0 + fin + k * 0.05, 0.5 - k * 0.1);
  return fin + 1.4;
}
function startMusic(ctx){
  if (audio.started || !splash.active || !soundOn()) return;
  audio.master = ctx.createGain(); audio.master.gain.value = 0.9; audio.master.connect(ctx.destination);
  scheduleJingle(ctx, audio.master, ctx.currentTime + 0.05);
  audio.started = true;
  const h = document.getElementById('sp-hint'); if (h) h.hidden = true;
}
function tryPlay(){
  if (!soundOn()) return false;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
    audio.ctx = audio.ctx || new AC();
    const ctx = audio.ctx;
    if (ctx.state === 'running'){ startMusic(ctx); return audio.started; }
    // телефон включает звук не сразу: ждём, пока он разрешит, и тогда стартуем
    if (ctx.resume) ctx.resume().then(() => { if (ctx.state === 'running') startMusic(ctx); }).catch(() => {});
    return false;
  } catch(e){ return false; }
}
function fadeAudio(){
  try { if (audio.master && audio.ctx){ const g = audio.master.gain, t = audio.ctx.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(0, t + 0.4); } } catch(e){}
}

/* ============ СВЯЗЬ С СЕРВЕРОМ (Yandex Cloud) ============

    if (!me()) return;
    if (!name){ ui.error = 'Дайте группе название.'; render(); return; }
    const j = await call('create', {name, budget:cStr(d.gbudget, 30).trim(), date:/^\d{4}-\d{2}-\d{2}$/.test(d.gdate||'') ? d.gdate : '', plays:d.gplays !== false});
    if (!j) return;
    ui.draft = {}; go('group', {groupId:j.gid});
  };
  A.confirmDraw = async function(){
    const g = db.groups[ui.groupId]; ui.modal = null; renderLayer();
    if (!g || g.drawn || g.adminId !== myId()) return;
    const j = await call('draw', {g:g.id});
    if (!j) return;
    hap('ok'); render(); toast('Жеребьёвка проведена');
  };
  // Остальные действия сразу видны на экране, а сервер подтверждает их в фоне
  const wrap = (name, before, after) => { const f = A[name]; A[name] = function(el){ const b = before(el); f.call(A, el); after(b, el); }; };
  const G = () => db.groups[ui.groupId];
  const ward = g => g && g.drawn && g.assign && g.assign[db.meId];
  wrap('setStage', () => { const g = G(); return g && (g.progress || {})[db.meId]; }, b => { const g = G(); if (!ward(g)) return; const v = (g.progress || {})[db.meId] || 0; if (v !== (b || 0)) send('stage', {g:g.id, v}); });
  wrap('askQ', () => { const g = G(); return JSON.stringify(g && (g.quiz || {})[ward(g)]); }, (b, el) => { const g = G(); if (ward(g) && JSON.stringify((g.quiz || {})[ward(g)]) !== b) send('ask', {g:g.id, q:el.dataset.v}); });
  wrap('answerQ', () => { const g = G(); return JSON.stringify(g && (g.quiz || {})[db.meId]); }, (b, el) => { const g = G(); if (g && JSON.stringify((g.quiz || {})[db.meId]) !== b) send('answer', {g:g.id, q:el.dataset.q, a:+el.dataset.v}); });
  A.sendCard = (f => function(el){ const g = G(), w = ward(g), b = JSON.stringify(w && (g.cards || {})[w]); f.call(A, el); const c = w && (g.cards || {})[w]; if (c && JSON.stringify(c) !== b) send('card', {g:g.id, tpl:c.tpl, text:c.text}); })(A.sendCard);
  const rulesSig = () => { const g = G(); return g ? JSON.stringify([g.exclude || [], g.smart !== false]) : ''; };
  const rulesSend = b => { const g = G(); if (g && !g.drawn && rulesSig() !== b) send('rules', {g:g.id, exclude:g.exclude || [], smart:g.smart !== false}); };
  wrap('exAdd', rulesSig, rulesSend); wrap('exDel', rulesSig, rulesSend);
  wrap('removeMember', () => ({id:ui.pendingId, g:ui.groupId}), b => { const g = db.groups[b.g]; if (g && b.id && !g.members.includes(b.id)) send('remove', {g:b.g, id:b.id}); });
  wrap('leaveGroup', () => ui.groupId, b => { const g = db.groups[b]; if (g && !g.members.includes(db.meId)) send('leave', {g:b}); });
  wrap('sendImage', () => { const g = G(), w = ward(g); return {img:ui.draft.pimg, v:w && (g.parcels || {})[w] ? g.parcels[w].v : 0}; }, b => { const g = G(), w = ward(g), p = w && (g.parcels || {})[w]; if (p && p.v !== b.v && isImg(b.img)) send('parcel', {g:g.id, img:b.img}); });
  wrap('requestNew', () => { const g = G(), p = g && (g.parcels || {})[db.meId]; return p && p.requested; }, b => { const g = G(), p = g && (g.parcels || {})[db.meId]; if (p && p.requested && !b) send('request', {g:g.id}); });
  wrap('sendMsg', () => ({text:cStr(ui.draft.msg, 500).trim(), tab:ui.chatTab}), b => { const g = G(); if (ward(g) && b.text && !ui.draft.msg) send('msg', {g:g.id, to:b.tab === 'santa' ? 'santa' : 'ward', text:b.text}); });
  wrap('guideClose', () => { const u = db.users[db.meId]; return u && u.guideSeen; }, b => { const u = db.users[db.meId]; if (u && u.guideSeen && !b) send('flag', {guideSeen:true}); });
  setInterval(() => { if (document.visibilityState === 'visible' && ui.screen === 'group') quietSync(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') quietSync(); });
}

/* ============ СТАРТ ============ */
(function init(){
  if (SRV){
    const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
    ui.startCode = (sp && sp.indexOf('join_') === 0) ? sp.slice(5) : null;
    if (!tgUser || !tgInit()){ net.state = 'needtg'; render(); }
    else firstSync();
    startSplash();
    return;
  }
  if (!db.users[db.meId] && tgUser){
    ui.draft = {name: [tgUser.first_name].filter(Boolean).join(' ')};
  }
  const sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  const code = (sp && sp.indexOf('join_')===0) ? sp.slice(5) : new URLSearchParams(location.search).get('join');
  if (code){
    if (db.users[db.meId]) joinGroup(code);
    else { ui.pendingJoin = cleanCode(code) || null; ui.screen = 'welcome'; render(); }
  } else render();
  startSplash();
})();
</script>
